# PreviewFlow Production Reverse Proxy Configuration (TLS + WebSockets + Wildcard Subdomain Previews)

upstream previewflow_api {
    server backend-api:4000;
    keepalive 32;
}

upstream previewflow_frontend {
    server frontend:80;
}

# Redirect all plain HTTP traffic to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Control-Plane Dashboard, API, OAuth, GitHub Webhooks, and Socket.IO
server {
    listen 443 ssl http2;
    server_name app.previewflow.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 2m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/(api|auth|webhooks|health) {
        proxy_pass http://previewflow_api;
        proxy_http_version 1.1;
    }

    location /socket.io/ {
        proxy_pass http://previewflow_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Restrict Prometheus /metrics scrape endpoint to private VPC / monitoring CIDRs
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://previewflow_api;
    }

    location / {
        proxy_pass http://previewflow_frontend;
    }
}

# Wildcard Tenant PR Preview Domains (origin isolation per PR/build)
server {
    listen 443 ssl http2;
    server_name *.previews.previewflow.example.com;

    resolver 127.0.0.11 ipv6=off valid=30s;

    ssl_certificate     /etc/nginx/certs/wildcard-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/wildcard-privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Internal auth subrequest dynamically maps *.previews.<domain> -> host preview container port
    location = /_resolve_preview {
        internal;
        proxy_pass http://previewflow_api/internal/resolve-preview?host=$host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        auth_request /_resolve_preview;
        auth_request_set $preview_upstream $upstream_http_x_preview_upstream;

        proxy_pass http://$preview_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
