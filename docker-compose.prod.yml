# PreviewFlow Production Stack (API / Worker / PostgreSQL / Frontend / Reverse Proxy)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-previewflow}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-previewflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PREVIEWFLOW_MODE: api
      PORT: 4000
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be >= 32 chars}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be >= 32 chars}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID must be set}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET must be set}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:?GITHUB_CALLBACK_URL must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PUBLIC_WEBHOOK_URL: ${PUBLIC_WEBHOOK_URL:?PUBLIC_WEBHOOK_URL must be set}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:?PREVIEW_BASE_DOMAIN must be set}
      PREVIEW_URL_PROTOCOL: ${PREVIEW_URL_PROTOCOL:-https}
      PREVIEW_UPSTREAM_HOST: ${PREVIEW_UPSTREAM_HOST:-host.docker.internal}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Dedicated build worker (Docker socket isolated from public API ingress service)
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backup_data:/app/backups
    environment:
      NODE_ENV: production
      PREVIEWFLOW_MODE: worker
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID must be set}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET must be set}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:?PREVIEW_BASE_DOMAIN must be set}
      PREVIEW_URL_PROTOCOL: ${PREVIEW_URL_PROTOCOL:-https}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_DIR: /app/backups
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend-api
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/nginx/previewflow.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./infra/certs}:/etc/nginx/certs:ro
    security_opt:
      - no-new-privileges:true

volumes:
  pg_data:
  backup_data:
